name: Publish to PyPI

# 邮件主题带上版本号: "Publish to PyPI (v0.2.0) - v0.2.0"
run-name: Publish to PyPI (${{ github.ref_name }})

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # Required for Trusted Publishing

jobs:
  quality-gate:
    name: Quality gate (ruff / mypy strict / pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and tools
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests examples && ruff format --check src tests examples

      - name: Mypy strict
        run: mypy src

      - name: Pytest
        run: pytest -q

  pypi-publish:
    name: Upload release to PyPI
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
