name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu 26.04 runners no longer provide Python 3.9; pin until 3.9 is dropped
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
