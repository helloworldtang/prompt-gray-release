[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-gray-release"
version = "0.3.0"
description = "把 Prompt 当生产代码发布：版本化、灰度放量、评测门禁、一键回滚、事故重演。Prompt release engineering: versioning, canary rollout, eval gates, rollback and incident replay."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "helloworldtang" }]
keywords = ["prompt", "llm", "gray-release", "canary", "prompt-engineering", "llmops", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Text Processing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
otel = ["opentelemetry-api>=1.20"]
dev = [
  "pytest>=7.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "jsonschema>=4.0",
  "build",
  "twine",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.exceptions", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[project.scripts]
prompt-gray = "prompt_gray_release.cli:main"

[project.urls]
Homepage = "https://github.com/helloworldtang/prompt-gray-release"
Issues = "https://github.com/helloworldtang/prompt-gray-release/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_gray_release = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
